---
- name: Configurar servidores do lab
  hosts: servidores
  become: true

  vars:
    pacotes:
      - curl
      - git
      - nginx
      - docker.io
      - docker-compose-v2

  tasks:
    - name: Atualizar cache do APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar pacotes
      ansible.builtin.apt:
        name: "{{pacotes}}"
        state: present

    - name: Garantir Docker ativo
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Adicionar o aluno ao grupo docker
      ansible.builtin.user:
        name: aluno
        groups: docker
        append: true
    
    - name: Criar o usuario do pipeline
      ansible.builtin.user:
        name: pipeline
        shell: /bin/bash
        create_home: true
        state: present

    - name: Criar diretorio do projeto
      ansible.builtin.file:
        path: /opt/datasci
        state: directory
        owner: aluno
        group: aluno
        mode: "0755"
      when: inventory_hostname == "devops-1"

    - name: Copiar arquivos da aplicacao
      ansible.builtin.copy:
       src: "{{ playbook_dir }}/../app/{{ item }}"
       dest: "/opt/datasci/{{ item }}"
       owner: aluno
       group: aluno
       mode: "0644"
      loop:
       - app.py
       - coletor.py
       - Dockerfile
       - requirements.txt
       - compose.yaml
       - .dockerignore
       - .env
      when: inventory_hostname == "devops-1"

    - name: Criar pagina de identificacao
      ansible.builtin.copy:
       dest: /var/www/html/index.html
       content: |
         Servidor configurado automaticamente pelo Ansible.
         Host: {{ inventory_hostname }}
       mode: "0644"
       
    - name: Garantir que o nginx esteja ativo
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

